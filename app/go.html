<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><meta name="viewport" content="width=device-width"><title>和颉下围棋</title><link rel="stylesheet" href="interaction-window.css"><link rel="stylesheet" href="go.css"></head><body><main><header><h1>黑白之间，慢慢来</h1><button id="close" aria-label="收起围棋盘">×</button></header><div class="game-options"><label>棋盘<select id="size"><option value="9">9 路</option><option value="13">13 路</option><option value="19">19 路</option></select></label><label>你执<select id="human"><option value="1">黑棋先手</option><option value="2">白棋后手</option></select></label><label>白方贴目<select id="komi"><option value="7.5">7.5 目</option><option value="6.5">6.5 目</option><option value="0">不贴目</option></select></label><button id="new">新局</button></div><p id="game-status" role="status"></p><div id="board-shell"><div id="col-labels"></div><div id="row-labels"></div><div id="board" role="grid" aria-label="围棋棋盘"></div></div><div class="buttons"><button id="pass">停一手</button><button id="undo">悔棋</button><button id="resign">认输</button><button id="confirm" hidden>确认死子并计分</button><button id="resume" hidden>继续下棋</button></div><p id="score" role="status"></p><p id="game-comment" role="status"></p><div id="comment-options"><label><input id="commentary" type="checkbox">颉的对局台词</label><label><input id="voice" type="checkbox">朗读台词</label></div><p class="hint">本地入门棋力，擅长基础提子与救棋。数子法：棋子＋单方围住的空点，白方贴目；禁自杀与重复棋形。双方停一手后，点棋子切换整块死子（标红），检查后确认；复杂死活请自行判断，有争议可继续下棋。</p><p class="hint">支持说“下在第九行第八列”“停一手”“悔棋”。Esc 收起，对局自动保存。</p><p id="error" role="alert"></p></main><script src="go-ui.js"></script></body></html>
