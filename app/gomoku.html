<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><meta name="viewport" content="width=device-width"><title>和颉下五子棋</title><link rel="stylesheet" href="interaction-window.css"></head><body><main><header><h1>一局棋，一卷闲话</h1><button id="close" aria-label="收起棋盘">×</button></header><div class="game-options"><label>难度<select id="difficulty"><option value="easy">简单</option><option value="normal">普通</option><option value="hard">困难</option><option value="challenge">挑战</option></select></label><label>你执<select id="human"><option value="1">黑棋先手</option><option value="2">白棋后手</option></select></label><button id="new">开始新局</button></div><p id="difficulty-help" class="hint"></p><p id="game-status" role="status" aria-live="polite"></p><div id="board-shell"><div id="col-labels"></div><div id="row-labels"></div><div id="board" role="grid" aria-label="15路自由五子棋棋盘"></div></div><div class="buttons"><button id="undo">悔棋</button><button id="resign">认输</button></div><p id="game-comment" role="status"></p><div id="comment-options"><label><input id="commentary" type="checkbox">颉的对局台词</label><label><input id="voice" type="checkbox">朗读台词</label></div><p class="hint">五子或长连即胜，无禁手。可说“下在第八行第八列”。Esc 收起棋盘，对局保留。</p><p id="error" role="alert"></p></main><script src="gomoku-ui.js"></script></body></html>
